# Alembic configuration file
# Generated for: AI Workforce Management System
# Driver: asyncpg (async SQLAlchemy)

[alembic]
# Path to migration scripts directory
script_location = migrations

# Template used to generate migration file names
file_template = %%(year)d%%(month)02d%%(day)02d_%%(hour)02d%%(minute)02d_%%(rev)s_%%(slug)s

# Timezone for generated file timestamps
timezone = UTC

# Max length for the slug portion of the migration filename
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# even if no autogenerate is used
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file
sourceless = false

# Version location - single folder
version_locations = %(here)s/migrations/versions

# The output encoding used when revision files are written
output_encoding = utf-8

# Database URL is intentionally left blank here.
# It is programmatically provided in migrations/env.py
# from the application's DATABASE_URL environment variable.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
