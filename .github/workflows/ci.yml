name: WorkforceOS CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-checks:
    name: Backend Linting, Typing & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 bandit

      - name: Run Static Security Analysis (Bandit)
        run: |
          bandit -r backend/app -ll -ii

      - name: Run Static Dependency & Architecture Validation
        run: |
          python check_dependencies.py

      - name: Run Employee Verification Suite
        run: |
          cd backend
          python verify_employee.py

      - name: Run Attendance Verification Suite
        run: |
          cd backend
          python verify_attendance.py

      - name: Run Leave Verification Suite
        run: |
          cd backend
          python verify_leave.py

      - name: Run Payroll Verification Suite
        run: |
          cd backend
          python verify_payroll.py

      - name: Run AI Insights Verification Suite
        run: |
          cd backend
          python verify_insights.py

  frontend-checks:
    name: Frontend Lint & Production Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Oxlint / Code Quality
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript Verification & Production Build
        working-directory: frontend
        run: npm run build

  file-integrity:
    name: Codebase Integrity & Non-Empty File Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify No Empty Source Files
        run: |
          python scripts/verify_nonempty.py
