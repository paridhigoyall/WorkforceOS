version: '3.8'

services:
  # ─── Database ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: workforceos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workforce_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-workforceos}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-workforceos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workforce_net

  # ─── Backend Replicas (High Concurrency Multi-Worker) ─────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: workforceos-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-workforce_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-workforceos}
      SECRET_KEY: ${SECRET_KEY:-workforce_production_jwt_secret_change_me_before_deploy}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,nginx}
      WORKERS: 4
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - workforce_net

  # ─── Frontend Web Application ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: workforceos-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - workforce_net

  # ─── Reverse Proxy & Load Balancer ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: workforceos_nginx_lb
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - workforce_net

volumes:
  postgres_data:
    driver: local

networks:
  workforce_net:
    driver: bridge
